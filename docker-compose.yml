# Production compose, deployed by Coolify.
#
# It names prebuilt images and must never gain a `build:` key again: GitHub
# Actions builds and pushes both images (.github/workflows/release.yml) and the
# VPS only pulls. Adding `build:` back here silently moves a Next compile onto a
# shared host — see docs/decisions/0001-build-in-ci-deploy-images.md.
#
# ${TAG} pins a specific image (the commit sha) for a manual rollback; it
# defaults to `main`, the tag every release moves.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/jtayped/moventis-lleida-web:${TAG:-main}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The NEXT_PUBLIC_* values the browser actually uses were inlined into
      # the bundle when the image was built in CI, from GitHub repository
      # variables. These runtime copies reach server code only; changing one
      # here does nothing to the page a visitor loads. Changing what the
      # browser sees means changing the repository variable and rebuilding.
      NEXT_PUBLIC_MAPS_API_KEY: ${NEXT_PUBLIC_MAPS_API_KEY}
      NEXT_PUBLIC_MAPS_MAP_ID: ${NEXT_PUBLIC_MAPS_MAP_ID}
      NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${NEXT_PUBLIC_UMAMI_SCRIPT_URL:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    image: ghcr.io/jtayped/moventis-lleida-scraper:${TAG:-main}
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
