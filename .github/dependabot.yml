version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # One PR per group rather than one per package: a monorepo with a
    # lockfile shared by five workspaces would otherwise drown in bumps.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Majors are done by hand: the first batch (Next 16, Prisma 7, ESLint 10,
    # Vitest 4, Expo 55) each broke lint, the build or the schema tooling and
    # needs a migration, not a bump.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
