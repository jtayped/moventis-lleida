version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # One PR per group rather than one per package: a monorepo with a
    # lockfile shared by five workspaces would otherwise drown in bumps.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
