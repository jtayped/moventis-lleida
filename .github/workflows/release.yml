name: release

# Builds both images and hands Coolify a tag to pull. Nothing is built on the
# VPS any more (docs/decisions/0001-build-in-ci-deploy-images.md).
#
# An image is never published from code that has not been verified. A push to
# main whose tree already passed `ci` on its pull request goes straight to the
# builds; any other tree (a direct push, or a merge onto a main that moved
# after the pull request's last run) runs ci.yml in full first.
#
# `workflow_dispatch` serves two purposes: with `image_tag` empty it rebuilds
# the chosen ref and deploys; with a tag it skips the builds and rolls
# Coolify back to that already-published image.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Roll back to this published image tag (a 40-character commit sha). Leave empty to rebuild and deploy.
        required: false
        default: ""
        type: string
      run_ci:
        description: When rebuilding, run the whole ci suite first, even if this tree already passed it.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Keyed on the commit, not the branch: two merges in quick succession each
# publish their own sha, and cancelling the first would leave `:main` pointing
# at an image whose deploy never ran.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  # build-push-action otherwise uploads a build record artifact for every
  # image, which nothing reads.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  # Whether a pull request already passed ci.yml on this exact tree. A merge
  # of an up-to-date branch always has, because ci.yml's `passed` job uploads
  # an artifact named after the tree of the pull request's merge commit, and
  # that tree is byte for byte what the merge puts on main. Skipped on a
  # rollback, which builds nothing.
  tree:
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - id: lookup
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner, repo, name: `ci-passed-${commit.tree.sha}`, per_page: 100,
            });
            // Only a run from this repository counts. A pull request from a
            // fork runs its own copy of ci.yml and could upload any name.
            const repositoryId = Number(process.env.GITHUB_REPOSITORY_ID);
            const passed = data.artifacts.find(
              (artifact) => !artifact.expired && artifact.workflow_run?.head_repository_id === repositoryId,
            );
            core.setOutput('verified', String(Boolean(passed)));
            await core.summary
              .addRaw(passed
                ? `Tree ${commit.tree.sha} passed CI in run ${passed.workflow_run.id}; CI is skipped.`
                : `No CI run passed on tree ${commit.tree.sha}; CI runs before the builds.`)
              .write();

  ci:
    needs: tree
    if: needs.tree.outputs.verified != 'true' || inputs.run_ci == true
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-web:
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    needs: [tree, ci]
    # `ci` is skipped when the tree already passed, and a skipped need would
    # otherwise skip this job too.
    if: >-
      !cancelled() && needs.tree.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.ci.result)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/jtayped/moventis-lleida-web:${{ github.sha }}
            ghcr.io/jtayped/moventis-lleida-web:main
          # Same scope as ci.yml's `docker (web)` job, so a pull request's
          # build reads the layers this one caches on main.
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          # Next inlines these into the browser bundle at build time, and
          # Coolify no longer builds anything, so this is the only place they
          # can be supplied. Repository variables rather than secrets: every
          # one of them ships to every visitor inside the JavaScript, and
          # calling a value secret when it is not is how a real secret ends up
          # beside it one day. The Maps key is protected by its HTTP referrer
          # restriction and its quota, not by being hidden.
          build-args: |
            NEXT_PUBLIC_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_MAPS_API_KEY }}
            NEXT_PUBLIC_MAPS_MAP_ID=${{ vars.NEXT_PUBLIC_MAPS_MAP_ID }}
            NEXT_PUBLIC_UMAMI_SCRIPT_URL=${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}

  build-scraper:
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    needs: [tree, ci]
    if: >-
      !cancelled() && needs.tree.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.ci.result)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/scraper/Dockerfile
          push: true
          tags: |
            ghcr.io/jtayped/moventis-lleida-scraper:${{ github.sha }}
            ghcr.io/jtayped/moventis-lleida-scraper:main
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,mode=max,scope=scraper

  deploy:
    # Both images, or Coolify pulls a tag that does not exist yet. `always()`
    # because a rollback dispatch skips `tree`, `ci` and the two builds on
    # purpose; the result test still refuses a build or a CI run that
    # actually failed. `tree` and `ci` are needed here for that reason: a
    # failed CI leaves the builds skipped, not failed, and this job would
    # otherwise redeploy the previous `:main`.
    needs: [tree, ci, build-web, build-scraper]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Coolify pulls the tags itself; this tells it a new one exists, then
      # waits for the deployment to finish and the site to answer. An accepted
      # webhook is not a successful deploy.
      - name: Deploy and wait for health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_HEALTH_URL: ${{ vars.COOLIFY_HEALTH_URL }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}
