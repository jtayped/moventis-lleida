name: ci

# Pull requests, and nothing on main. `release` calls this workflow for a
# push only when no pull request already passed on that exact tree, which a
# merge of an up-to-date branch always has. `passed` below is what records it.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. A call from `release`
# gets a group of its own, so it never waits behind or cancels anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Source-only checks: lint, types and the deterministic test suite. Nothing
  # here touches the network or a database — the Moventis API canary is the
  # opt-in `pnpm test:live`, never CI.
  check:
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    # `next lint` loads next.config.js, which imports src/env.js, which
    # validates the environment on import. No .env exists on a runner, so the
    # validation has to be skipped for lint to run at all — same switch the
    # Docker build uses.
    env:
      SKIP_ENV_VALIDATION: 1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  # Does the web app compile. Placeholder env only: the `page.tsx` route is
  # dynamic (it reads searchParams), so nothing here reaches the database, and
  # NEXT_PUBLIC_* values are inlined into the bundle at build time anyway —
  # the real ones come from repository variables in the `release` workflow,
  # which is the only place a shipped image is built.
  build:
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    env:
      SKIP_ENV_VALIDATION: 1
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_MAPS_API_KEY: ci-placeholder
      NEXT_PUBLIC_MAPS_MAP_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build --filter=@moventis/web

  # Production runs the images `release` builds from these two Dockerfiles
  # (see docs/deployment.md), so a Dockerfile that no longer builds is a broken
  # deploy that `build` above cannot see: the prune, the Alpine base image and
  # the Prisma engine download only exist here.
  #
  # `push: false` — nothing is published from a pull request. The `release`
  # workflow builds again on the same `type=gha` cache scopes once the merge
  # lands. It reads what earlier builds on main cached, not this run's
  # layers: GitHub does not let main read a pull request's cache.
  docker:
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: apps/web/Dockerfile
            build-args: |
              NEXT_PUBLIC_MAPS_API_KEY=ci-placeholder
              NEXT_PUBLIC_MAPS_MAP_ID=ci-placeholder
          - name: scraper
            file: apps/scraper/Dockerfile
            build-args: ""
    name: docker (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Records the tree this run verified, as an artifact named after it. On a
  # push to main, `release` looks that name up and goes straight to the image
  # builds when it finds one, so a merge does not run the whole suite a
  # second time over files it has already checked. The tree is the pull
  # request's merge commit, which is byte for byte what a merge of an
  # up-to-date branch puts on main.
  passed:
    needs: [check, build, docker]
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_PIN || 'ubuntu-latest' }}
    steps:
      - id: tree
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.git.getCommit({ ...context.repo, commit_sha: context.sha });
            return data.tree.sha;
      - run: echo "$GITHUB_SHA" > "$RUNNER_TEMP/verified-commit"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ steps.tree.outputs.result }}
          path: ${{ runner.temp }}/verified-commit
          retention-days: 30
